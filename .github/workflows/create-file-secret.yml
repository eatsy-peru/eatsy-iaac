name: Store File as Base64 KeyVault Secret

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (dev, prd)'
        required: true
        type: choice
        options:
          - dev
          - prd
      secret_name:
        description: 'Name of the Key Vault secret (e.g., "myapp-config-b64")'
        required: true
        type: string
      blob_name:
        description: 'Blob name for the file in certs container (e.g., "myapp/config.json")'
        required: true
        type: string
      delete_file:
        description: 'Delete file from blob storage after processing'
        required: false
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

env:
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_IAAC_CLIENT_ID: ${{ secrets.AZURE_IAAC_CLIENT_ID }}
  AZURE_IAAC_SUBSCRIPTION_ID: ${{ secrets.AZURE_IAAC_SUBSCRIPTION_ID }}
  IAAC_KEY_VAULT_NAME: ${{ secrets.IAAC_KEY_VAULT_NAME }}
  IAAC_CERTS_STORAGE_ACCOUNT_NAME: ${{ secrets.IAAC_CERTS_STORAGE_ACCOUNT_NAME }}
  SECRET_NAME: ${{ github.event.inputs.secret_name }}
  BLOB_NAME: ${{ github.event.inputs.blob_name }}

jobs:
  store-file-as-secret:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_IAAC_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_IAAC_SUBSCRIPTION_ID }}
          enable-AzPSSession: false

      - name: Validate configuration
        run: |
          if [ -z "${IAAC_KEY_VAULT_NAME}" ]; then
            echo "ERROR: IAAC_KEY_VAULT_NAME secret not configured for ${{ github.event.inputs.environment }} environment"
            exit 1
          fi
          if [ -z "${IAAC_CERTS_STORAGE_ACCOUNT_NAME}" ]; then
            echo "ERROR: IAAC_CERTS_STORAGE_ACCOUNT_NAME secret not configured for ${{ github.event.inputs.environment }} environment"
            exit 1
          fi

          echo "✓ Using Key Vault: ${IAAC_KEY_VAULT_NAME}"
          echo "✓ Using Storage Account: ${IAAC_CERTS_STORAGE_ACCOUNT_NAME}"

      - name: Download file from blob storage
        run: |
          az storage blob download \
            --account-name "${IAAC_CERTS_STORAGE_ACCOUNT_NAME}" \
            --container-name "certs" \
            --name "${BLOB_NAME}" \
            --file upload.bin \
            --auth-mode login \
            --output none

          if [ ! -f "upload.bin" ]; then
            echo "ERROR: Failed to download file"
            exit 1
          fi
          echo "✓ Downloaded ${BLOB_NAME}"

      - name: Encode file to Base64 and store in Key Vault
        run: |
          base64 -w0 upload.bin > upload.b64

          # Key Vault secrets are limited to 25 KB
          size=$(wc -c < upload.b64)
          if [ "${size}" -gt 25600 ]; then
            echo "ERROR: Base64 content is ${size} bytes, exceeds the 25 KB Key Vault secret limit"
            exit 1
          fi

          az keyvault secret set \
            --vault-name "${IAAC_KEY_VAULT_NAME}" \
            --name "${SECRET_NAME}" \
            --file upload.b64 \
            --output none
          echo "✓ Stored ${SECRET_NAME} (${size} bytes base64)"

      - name: Delete file from blob storage
        if: github.event.inputs.delete_file == 'true'
        run: |
          az storage blob delete \
            --account-name "${IAAC_CERTS_STORAGE_ACCOUNT_NAME}" \
            --container-name "certs" \
            --name "${BLOB_NAME}" \
            --auth-mode login \
            --output none || echo "⚠ File deletion skipped or not found"

          echo "✓ File deleted from blob storage"

      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f upload.bin upload.b64
          echo "✓ Cleanup completed"

      - name: Summary
        if: success()
        run: |
          {
            echo "## ✅ File Secret Successfully Created"
            echo ""
            echo "**Environment:** ${{ github.event.inputs.environment }}"
            echo "**Key Vault:** ${IAAC_KEY_VAULT_NAME}"
            echo "**Secret:** \`${SECRET_NAME}\`"
            echo "**Source blob:** \`${BLOB_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"
